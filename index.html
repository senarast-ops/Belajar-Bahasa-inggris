<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Quest SD - Belajar Bahasa Inggris Kelas 1-6</title>
  <style>
    :root {
      --bg: #f0f7ff;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --accent: #f59e0b;
      --success: #16a34a;
      --danger: #dc2626;
      --text: #1e293b;
      --muted: #64748b;
    }
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      margin: 0;
      background: linear-gradient(180deg, #dbeafe 0%, #f0fdf4 100%);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      background: var(--card);
      padding: 14px 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.2rem;
      color: var(--primary);
      cursor: pointer;
    }
    .stats-bar {
      display: flex;
      gap: 10px;
      align-items: center;
      font-weight: 700;
    }
    .pill {
      background: #fef3c7;
      color: #b45309;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.95rem;
    }
    .container {
      max-width: 920px;
      margin: 24px auto;
      padding: 0 16px 40px;
    }
    .hero {
      text-align: center;
      margin-bottom: 24px;
    }
    .hero h1 {
      margin: 0 0 8px;
      font-size: 1.9rem;
      color: #0f172a;
    }
    .hero p {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
    }
    .grade-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
    }
    .grade-card {
      background: var(--card);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.08);
      border: 3px solid transparent;
      transition: transform 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .grade-card:hover {
      transform: translateY(-4px);
      border-color: #93c5fd;
    }
    .grade-badge {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.85rem;
      margin-bottom: 10px;
      width: fit-content;
    }
    .grade-card h3 { margin: 4px 0 8px; font-size: 1.25rem; }
    .grade-card p { margin: 0 0 16px; color: var(--muted); font-size: 0.92rem; line-height: 1.4; }
    .card-actions {
      display: flex;
      gap: 8px;
    }
    button {
      border: none;
      border-radius: 12px;
      padding: 11px 16px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    button:active { transform: scale(0.97); }
    .btn-primary {
      background: var(--primary);
      color: #fff;
      flex: 1;
      box-shadow: 0 4px 0 var(--primary-dark);
    }
    .btn-secondary {
      background: #e0e7ff;
      color: #1e40af;
      flex: 1;
    }
    .btn-speak {
      background: #fef3c7;
      color: #b45309;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
    }
    .hidden { display: none !important; }

    /* Panel Belajar & Bermain */
    .game-box {
      background: var(--card);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      max-width: 680px;
      margin: 0 auto;
    }
    .top-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .progress-wrap {
      flex: 1;
      height: 12px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      min-width: 140px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #22c55e);
      width: 0%;
      transition: width 0.3s ease;
    }
    .hearts { font-size: 1.2rem; letter-spacing: 2px; }
    .photo-frame {
      width: 100%;
      max-width: 340px;
      height: 230px;
      margin: 10px auto 16px;
      border-radius: 18px;
      overflow: hidden;
      background: #f8fafc;
      border: 3px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .fallback-emoji {
      font-size: 5rem;
    }
    .question-prompt {
      text-align: center;
      font-size: 1.2rem;
      font-weight: 800;
      margin: 10px 0 6px;
    }
    .sub-prompt {
      text-align: center;
      color: var(--muted);
      margin-bottom: 18px;
      font-size: 0.95rem;
    }
    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    @media (max-width: 520px) {
      .options-grid { grid-template-columns: 1fr; }
    }
    .opt-btn {
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      padding: 14px;
      font-size: 1.05rem;
      color: var(--text);
      border-radius: 14px;
    }
    .opt-btn:hover { border-color: var(--primary); background: #eff6ff; }
    .opt-btn.correct { background: #dcfce7; border-color: var(--success); color: #14532d; }
    .opt-btn.wrong { background: #fee2e2; border-color: var(--danger); color: #7f1d1d; }

    /* Susun Huruf & Kalimat */
    .answer-slots {
      min-height: 56px;
      border: 2px dashed #94a3b8;
      border-radius: 14px;
      padding: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      align-items: center;
      margin-bottom: 14px;
      background: #f8fafc;
    }
    .bank-tokens {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 16px;
    }
    .token-btn {
      background: #e0f2fe;
      color: #0369a1;
      border: 2px solid #7dd3fc;
      padding: 10px 15px;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 800;
    }
    .token-btn.used { opacity: 0.3; pointer-events: none; }

    .feedback-banner {
      margin-top: 16px;
      padding: 14px;
      border-radius: 14px;
      text-align: center;
      font-weight: 700;
    }
    .feedback-ok { background: #dcfce7; color: #166534; }
    .feedback-bad { background: #fee2e2; color: #991b1b; }

    /* Flashcard Belajar */
    .flashcard-word {
      text-align: center;
      font-size: 1.7rem;
      font-weight: 900;
      color: var(--primary);
      margin: 6px 0 2px;
    }
    .flashcard-meaning {
      text-align: center;
      font-size: 1.1rem;
      color: var(--muted);
      margin-bottom: 14px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand" onclick="goHome()">🎒 English Quest SD</div>
    <div class="stats-bar">
      <div class="pill">⭐ <span id="totalStars">0</span> Bintang</div>
    </div>
  </header>

  <div class="container">
    <!-- HALAMAN MENU KELAS 1-6 -->
    <section id="homeScreen">
      <div class="hero">
        <h1>Petualangan Bahasa Inggris Kelas 1–6 SD</h1>
        <p>Belajar lewat foto objek nyata, pelafalan suara asli, dan mini-game seru di setiap kelas!</p>
      </div>
      <div class="grade-grid" id="gradeGrid"></div>
    </section>

    <!-- HALAMAN MODE BELAJAR (FLASHCARD) -->
    <section id="studyScreen" class="hidden">
      <div class="game-box">
        <div class="top-controls">
          <button class="btn-secondary" style="flex:0" onclick="goHome()">⬅ Menu</button>
          <strong id="studyTitle">Materi Kelas</strong>
          <span id="studyCounter" style="color:var(--muted);font-weight:700">1/6</span>
        </div>
        <div class="photo-frame" id="studyPhotoBox"></div>
        <div style="text-align:center">
          <div class="flashcard-word" id="studyEn">Apple</div>
          <div class="flashcard-meaning" id="studyId">Artinya: Apel</div>
          <button class="btn-speak" onclick="speakCurrentStudy()">🔊 Dengarkan Cara Baca</button>
        </div>
        <div class="card-actions" style="margin-top:22px">
          <button class="btn-secondary" onclick="prevStudy()">⬅ Sebelumnya</button>
          <button class="btn-primary" onclick="nextStudy()" id="nextStudyBtn">Selanjutnya ➡</button>
        </div>
      </div>
    </section>

    <!-- HALAMAN BERMAIN KUIS INTERAKTIF -->
    <section id="playScreen" class="hidden">
      <div class="game-box">
        <div class="top-controls">
          <button class="btn-secondary" style="flex:0" onclick="goHome()">⬅ Keluar</button>
          <div class="progress-wrap"><div class="progress-fill" id="progressBar"></div></div>
          <div class="hearts" id="heartsDisplay">❤️❤️❤️</div>
        </div>

        <div class="photo-frame" id="quizPhotoBox"></div>
        <div style="text-align:center">
          <button class="btn-speak" id="quizSpeakBtn" onclick="speakQuizAudio()">🔊 Putar Suara</button>
        </div>

        <div class="question-prompt" id="questionText"></div>
        <div class="sub-prompt" id="subPromptText"></div>

        <!-- Area Pilihan Ganda -->
        <div id="mcqArea" class="options-grid"></div>

        <!-- Area Susun Huruf / Kalimat -->
        <div id="builderArea" class="hidden">
          <div class="answer-slots" id="answerSlots"></div>
          <div class="bank-tokens" id="bankTokens"></div>
          <div class="card-actions">
            <button class="btn-secondary" onclick="resetBuilder()">🔄 Ulangi Susunan</button>
            <button class="btn-primary" onclick="checkBuilderAnswer()">✅ Periksa Jawaban</button>
          </div>
        </div>

        <div id="feedbackBox" class="feedback-banner hidden"></div>
        <button id="nextQuestionBtn" class="btn-primary hidden" style="width:100%;margin-top:14px" onclick="nextQuestion()">Lanjut Soal Berikutnya ➡</button>
      </div>
    </section>

    <!-- HALAMAN HASIL SKOR -->
    <section id="resultScreen" class="hidden">
      <div class="game-box" style="text-align:center">
        <div style="font-size:4rem" id="resultIcon">🏆</div>
        <h2 id="resultTitle">Luar Biasa!</h2>
        <p id="resultDesc" style="color:var(--muted);font-size:1.05rem"></p>
        <div class="card-actions" style="margin-top:20px">
          <button class="btn-secondary" onclick="goHome()">🏠 Pilih Kelas Lain</button>
          <button class="btn-primary" onclick="replayCurrentGrade()">🔁 Main Lagi</button>
        </div>
      </div>
    </section>
  </div>

  <script>
    // KURIKULUM LENGKAP KELAS 1 - 6 SD DENGAN FOTO ENSIKLOPEDIA REALISTIS (WIKIPEDIA REST API)
    const CURRICULUM = [
      {
        grade: 1,
        color: "#dbeafe",
        textColor: "#1e40af",
        title: "Kelas 1: Hewan & Buah Sekitar",
        desc: "Pola Tap & Listen: Kenali foto objek asli, dengarkan suaranya, dan pilih kosakata dasar.",
        items: [
          { wiki: "Apple", emoji: "🍎", en: "Apple", id: "Apel", mode: "mcq", q: "Buah apakah yang ada pada foto?", options: ["Apple", "Banana", "Orange", "Grape"], answer: "Apple" },
          { wiki: "Cat", emoji: "🐱", en: "Cat", id: "Kucing", mode: "mcq", q: "Hewan peliharaan apakah ini?", options: ["Dog", "Cat", "Bird", "Fish"], answer: "Cat" },
          { wiki: "Banana", emoji: "🍌", en: "Banana", id: "Pisang", mode: "mcq", q: "Pilih bahasa Inggris dari buah kuning ini:", options: ["Banana", "Apple", "Papaya", "Melon"], answer: "Banana" },
          { wiki: "Dog", emoji: "🐶", en: "Dog", id: "Anjing", mode: "mcq", q: "Dengarkan suaranya! Hewan apakah ini?", options: ["Rabbit", "Cat", "Dog", "Duck"], answer: "Dog" },
          { wiki: "Elephant", emoji: "🐘", en: "Elephant", id: "Gajah", mode: "mcq", q: "Hewan bertubuh besar berbelalai panjang ini adalah...", options: ["Tiger", "Elephant", "Monkey", "Horse"], answer: "Elephant" },
          { wiki: "Strawberry", emoji: "🍓", en: "Strawberry", id: "Stroberi", mode: "mcq", q: "Apa nama buah berwarna merah berbintik ini?", options: ["Strawberry", "Mango", "Coconut", "Lemon"], answer: "Strawberry" }
        ]
      },
      {
        grade: 2,
        color: "#dcfce7",
        textColor: "#166534",
        title: "Kelas 2: Benda Sekolah & Rumah",
        desc: "Pola Picture Match: Mencocokkan alat tulis sekolah dan perlengkapan harian dengan tepat.",
        items: [
          { wiki: "Pencil", emoji: "✏️", en: "Pencil", id: "Pensil", mode: "mcq", q: "Alat tulis pada foto ini dalam bahasa Inggris adalah...", options: ["Pencil", "Ruler", "Eraser", "Bag"], answer: "Pencil" },
          { wiki: "Book", emoji: "📖", en: "Book", id: "Buku", mode: "mcq", q: "Kita membaca ilmu pengetahuan dari benda ini:", options: ["Chair", "Table", "Book", "Shoes"], answer: "Book" },
          { wiki: "Backpack", emoji: "🎒", en: "Backpack", id: "Tas Ransel", mode: "mcq", q: "Tas yang dipakai ke sekolah ini disebut...", options: ["Hat", "Backpack", "Window", "Pillow"], answer: "Backpack" },
          { wiki: "Chair", emoji: "🪑", en: "Chair", id: "Kursi", mode: "mcq", q: "Tempat duduk di ruang kelas ini adalah...", options: ["Chair", "Door", "Lamp", "Clock"], answer: "Chair" },
          { wiki: "Scissors", emoji: "✂️", en: "Scissors", id: "Gunting", mode: "mcq", q: "Alat untuk memotong kertas ini bernama...", options: ["Paper", "Scissors", "Crayon", "Bottle"], answer: "Scissors" },
          { wiki: "Shoe", emoji: "👟", en: "Shoes", id: "Sepatu", mode: "mcq", q: "Alas kaki yang dipakai sebelum berangkat sekolah:", options: ["Socks", "Shirt", "Shoes", "Glasses"], answer: "Shoes" }
        ]
      },
      {
        grade: 3,
        color: "#fef3c7",
        textColor: "#92400e",
        title: "Kelas 3: Makanan & Cuaca (Spelling Bee)",
        desc: "Pola Susun Huruf: Eja huruf acak menjadi kata bahasa Inggris yang benar sesuai foto objek!",
        items: [
          { wiki: "Milk", emoji: "🥛", en: "MILK", id: "Susu", mode: "spell", q: "Susun huruf menjadi bahasa Inggris dari 'Susu':", tokens: ["M", "I", "L", "K"], answer: "MILK" },
          { wiki: "Bread", emoji: "🍞", en: "BREAD", id: "Roti", mode: "spell", q: "Eja kata bahasa Inggris untuk 'Roti' pada foto:", tokens: ["B", "R", "E", "A", "D"], answer: "BREAD" },
          { wiki: "Rain", emoji: "🌧️", en: "RAIN", id: "Hujan", mode: "spell", q: "Air yang turun dari awan disebut...", tokens: ["R", "A", "I", "N"], answer: "RAIN" },
          { wiki: "Pizza", emoji: "🍕", en: "PIZZA", id: "Pizza", mode: "spell", q: "Susun huruf nama makanan bundar ini:", tokens: ["P", "I", "Z", "Z", "A"], answer: "PIZZA" },
          { wiki: "Umbrella", emoji: "☂️", en: "UMBRELLA", id: "Payung", mode: "mcq", q: "Saat hujan kita memakai benda ini:", options: ["Umbrella", "Blanket", "Helmet", "Jacket"], answer: "Umbrella" },
          { wiki: "Rainbow", emoji: "🌈", en: "RAINBOW", id: "Pelangi", mode: "mcq", q: "Warna-warni indah di langit setelah hujan adalah...", options: ["Cloud", "Rainbow", "Thunder", "Sunshine"], answer: "Rainbow" }
        ]
      },
      {
        grade: 4,
        color: "#fce7f3",
        textColor: "#9d174d",
        title: "Kelas 4: Profesi, Tempat & Waktu",
        desc: "Pola Detective Quiz: Mengenal cita-cita profesi, tempat umum, dan penunjuk waktu.",
        items: [
          { wiki: "Firefighter", emoji: "🚒", en: "Firefighter", id: "Pemadam Kebakaran", mode: "mcq", q: "Profesi petugas pemberani yang memadamkan api:", options: ["Firefighter", "Farmer", "Dentist", "Pilot"], answer: "Firefighter" },
          { wiki: "Hospital", emoji: "🏥", en: "Hospital", id: "Rumah Sakit", mode: "mcq", q: "Dokter dan perawat merawat pasien di tempat ini:", options: ["Market", "Hospital", "Bakery", "Airport"], answer: "Hospital" },
          { wiki: "Library", emoji: "📚", en: "Library", id: "Perpustakaan", mode: "mcq", q: "Where can we borrow and read many books?", options: ["Kitchen", "Library", "Stadium", "Garage"], answer: "Library" },
          { wiki: "Chef", emoji: "👨‍🍳", en: "Chef", id: "Koki Juru Masak", mode: "mcq", q: "A person who cooks delicious food in a restaurant is a...", options: ["Chef", "Driver", "Singer", "Police"], answer: "Chef" },
          { wiki: "Astronaut", emoji: "👨‍🚀", en: "Astronaut", id: "Astronot", mode: "mcq", q: "Siapakah yang pergi menjelajah luar angkasa?", options: ["Sailor", "Astronaut", "Teacher", "Painter"], answer: "Astronaut" },
          { wiki: "Alarm_clock", emoji: "⏰", en: "Clock", id: "Jam", mode: "mcq", q: "We look at the ___ to know what time it is.", options: ["Mirror", "Clock", "Carpet", "Wallet"], answer: "Clock" }
        ]
      },
      {
        grade: 5,
        color: "#ede9fe",
        textColor: "#5b21b6",
        title: "Kelas 5: Transportasi & Susun Kalimat",
        desc: "Pola Sentence Builder: Menyusun potongan kata menjadi kalimat Simple Present Tense yang utuh.",
        items: [
          { wiki: "Bicycle", emoji: "🚲", en: "I ride a bicycle", id: "Saya mengendarai sepeda", mode: "sentence", q: "Susun menjadi kalimat: 'Saya mengendarai sepeda'", tokens: ["I", "ride", "a", "bicycle"], answer: "I ride a bicycle" },
          { wiki: "Airplane", emoji: "✈️", en: "The airplane flies fast", id: "Pesawat itu terbang cepat", mode: "sentence", q: "Susun menjadi kalimat: 'Pesawat itu terbang cepat'", tokens: ["The", "airplane", "flies", "fast"], answer: "The airplane flies fast" },
          { wiki: "Giraffe", emoji: "🦒", en: "A giraffe has a long neck", id: "Jerapah memiliki leher panjang", mode: "sentence", q: "Susun kalimat deskripsi hewan pada foto:", tokens: ["A giraffe", "has", "a long", "neck"], answer: "A giraffe has a long neck" },
          { wiki: "Guitar", emoji: "🎸", en: "She plays the guitar", id: "Dia bermain gitar", mode: "sentence", q: "Susun menjadi kalimat: 'Dia (perempuan) bermain gitar'", tokens: ["She", "plays", "the", "guitar"], answer: "She plays the guitar" },
          { wiki: "Train", emoji: "🚆", en: "We go by train", id: "Kami pergi naik kereta api", mode: "sentence", q: "Susun kalimat: 'Kami pergi naik kereta api'", tokens: ["We", "go", "by", "train"], answer: "We go by train" }
        ]
      },
      {
        grade: 6,
        color: "#ffedd5",
        textColor: "#9a3412",
        title: "Kelas 6: Cerita Liburan & Percakapan",
        desc: "Pola Interactive Roleplay: Percakapan nyata sehari-hari dan kalimat cerita masa lampau (Past Tense).",
        items: [
          { wiki: "Beach", emoji: "🏖️", en: "We went to the beach yesterday", id: "Kami pergi ke pantai kemarin", mode: "mcq", q: "Lengkapi cerita lampau: 'Last Sunday, my family ___ to the beach.'", options: ["went", "go", "goes", "going"], answer: "went" },
          { wiki: "Museum", emoji: "🏛️", en: "They visited the museum", id: "Mereka mengunjungi museum", mode: "sentence", q: "Susun kalimat Past Tense: 'Mereka mengunjungi museum'", tokens: ["They", "visited", "the", "museum"], answer: "They visited the museum" },
          { wiki: "Restaurant", emoji: "🍽️", en: "May I see the menu, please?", id: "Bolehkah saya melihat menunya?", mode: "mcq", q: "Kalimat sopan saat ingin memesan makanan di restoran adalah...", options: ["May I see the menu, please?", "Where is my bedroom?", "Close the buku now!", "Good night teacher!"], answer: "May I see the menu, please?" },
          { wiki: "Train_station", emoji: "🚉", en: "Excuse me, where is the train station?", id: "Permisi, di mana stasiun kereta?", mode: "mcq", q: "Rani tersesat dan ingin bertanya arah ke stasiun kereta dengan sopan:", options: ["Excuse me, where is the train station?", "What is your favorite fruit?", "Happy birthday to you!", "I am ten years old."], answer: "Excuse me, where is the train station?" },
          { wiki: "Mountain", emoji: "⛰️", en: "We climbed a high mountain", id: "Kami mendaki gunung yang tinggi", mode: "sentence", q: "Susun cerita liburan: 'Kami mendaki gunung yang tinggi'", tokens: ["We", "climbed", "a high", "mountain"], answer: "We climbed a high mountain" }
        ]
      }
    ];

    // Penyimpanan Cache Foto Wikipedia & Skor Bintang Anak
    const photoCache = {};
    let savedStars = JSON.parse(localStorage.getItem("eq_sd_stars") || "{}");

    let currentGradeObj = null;
    let studyIndex = 0;
    let quizIndex = 0;
    let hearts = 3;
    let correctCount = 0;
    let selectedTokens = [];
    let answered = false;

    // Efek Suara Ceria Tanpa File Eksternal (Web Audio API)
    function playTone(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        if (type === "win") {
          osc.frequency.setValueAtTime(523, ctx.currentTime);
          osc.frequency.setValueAtTime(659, ctx.currentTime + 0.1);
          osc.frequency.setValueAtTime(784, ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
          osc.start();
          osc.stop(ctx.currentTime + 0.45);
        } else {
          osc.frequency.setValueAtTime(240, ctx.currentTime);
          osc.frequency.setValueAtTime(180, ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
          osc.start();
          osc.stop(ctx.currentTime + 0.35);
        }
      } catch (e) {}
    }

    // Pelafalan Suara Asli Bahasa Inggris (Web Speech API)
    function speakEnglish(text) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "en-US";
      utter.rate = 0.88;
      utter.pitch = 1.05;
      window.speechSynthesis.speak(utter);
    }

    // Ambil Foto Realistis Asli dari Wikipedia REST API
    async function renderRealisticPhoto(containerId, wikiTitle, fallbackEmoji) {
      const box = document.getElementById(containerId);
      box.innerHTML = `<div class="fallback-emoji">${fallbackEmoji}</div>`;
      if (photoCache[wikiTitle]) {
        box.innerHTML = `<img src="${photoCache[wikiTitle]}" alt="${wikiTitle}" />`;
        return;
      }
      try {
        const res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(wikiTitle)}`);
        if (!res.ok) return;
        const data = await res.json();
        if (data.thumbnail && data.thumbnail.source) {
          photoCache[wikiTitle] = data.thumbnail.source;
          box.innerHTML = `<img src="${data.thumbnail.source}" alt="${wikiTitle}" />`;
        }
      } catch (err) {
        // Otomatis tetap menampilkan ilustrasi bersih jika sedang tanpa internet
      }
    }

    function updateStarTotal() {
      const sum = Object.values(savedStars).reduce((a, b) => a + b, 0);
      document.getElementById("totalStars").textContent = sum;
    }

    function renderHome() {
      updateStarTotal();
      const grid = document.getElementById("gradeGrid");
      grid.innerHTML = "";
      CURRICULUM.forEach((c) => {
        const stars = savedStars[c.grade] || 0;
        const starStr = "⭐".repeat(stars) + "☆".repeat(3 - stars);
        const card = document.createElement("div");
        card.className = "grade-card";
        card.innerHTML = `
          <div>
            <div style="display:flex;justify-content:space-between;align-items:center">
              <span class="grade-badge" style="background:${c.color};color:${c.textColor}">KELAS ${c.grade} SD</span>
              <span style="font-size:1.1rem">${starStr}</span>
            </div>
            <h3>${c.title}</h3>
            <p>${c.desc}</p>
          </div>
          <div class="card-actions">
            <button class="btn-secondary" onclick="startStudy(${c.grade})">📖 Belajar Dulu</button>
            <button class="btn-primary" onclick="startPlay(${c.grade})">🎮 Mulai Main</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function showSection(id) {
      ["homeScreen", "studyScreen", "playScreen", "resultScreen"].forEach((s) => {
        document.getElementById(s).classList.toggle("hidden", s !== id);
      });
    }

    function goHome() {
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      renderHome();
      showSection("homeScreen");
    }

    // ================= MODE BELAJAR (FLASHCARD) =================
    function startStudy(gradeNum) {
      currentGradeObj = CURRICULUM.find((g) => g.grade === gradeNum);
      studyIndex = 0;
      showSection("studyScreen");
      renderStudyCard();
    }

    function renderStudyCard() {
      const item = currentGradeObj.items[studyIndex];
      document.getElementById("studyTitle").textContent = currentGradeObj.title;
      document.getElementById("studyCounter").textContent = `${studyIndex + 1} / ${currentGradeObj.items.length}`;
      document.getElementById("studyEn").textContent = item.en;
      document.getElementById("studyId").textContent = `Artinya: ${item.id}`;
      document.getElementById("nextStudyBtn").textContent =
        studyIndex === currentGradeObj.items.length - 1 ? "🎮 Lanjut Main Kuis!" : "Selanjutnya ➡";
      renderRealisticPhoto("studyPhotoBox", item.wiki, item.emoji);
      speakEnglish(item.en);
    }

    function speakCurrentStudy() {
      speakEnglish(currentGradeObj.items[studyIndex].en);
    }

    function prevStudy() {
      if (studyIndex > 0) {
        studyIndex--;
        renderStudyCard();
      }
    }

    function nextStudy() {
      if (studyIndex < currentGradeObj.items.length - 1) {
        studyIndex++;
        renderStudyCard();
      } else {
        startPlay(currentGradeObj.grade);
      }
    }

    // ================= MODE BERMAIN KUIS =================
    function startPlay(gradeNum) {
      currentGradeObj = CURRICULUM.find((g) => g.grade === gradeNum);
      quizIndex = 0;
      hearts = 3;
      correctCount = 0;
      showSection("playScreen");
      renderQuestion();
    }

    function replayCurrentGrade() {
      startPlay(currentGradeObj.grade);
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function speakQuizAudio() {
      const item = currentGradeObj.items[quizIndex];
      speakEnglish(item.en);
    }

    function renderQuestion() {
      answered = false;
      const total = currentGradeObj.items.length;
      const item = currentGradeObj.items[quizIndex];

      document.getElementById("progressBar").style.width = `${(quizIndex / total) * 100}%`;
      document.getElementById("heartsDisplay").textContent = "❤️".repeat(hearts) + "🖤".repeat(3 - hearts);
      document.getElementById("questionText").textContent = item.q;
      document.getElementById("feedbackBox").classList.add("hidden");
      document.getElementById("nextQuestionBtn").classList.add("hidden");

      renderRealisticPhoto("quizPhotoBox", item.wiki, item.emoji);
      speakEnglish(item.en);

      const mcqArea = document.getElementById("mcqArea");
      const builderArea = document.getElementById("builderArea");

      if (item.mode === "mcq") {
        document.getElementById("subPromptText").textContent = "Klik jawaban bahasa Inggris yang paling tepat!";
        mcqArea.classList.remove("hidden");
        builderArea.classList.add("hidden");
        mcqArea.innerHTML = "";
        shuffleArray(item.options).forEach((opt) => {
          const btn = document.createElement("button");
          btn.className = "opt-btn";
          btn.textContent = opt;
          btn.onclick = () => checkMcq(btn, opt, item.answer);
          mcqArea.appendChild(btn);
        });
      } else {
        document.getElementById("subPromptText").textContent =
          item.mode === "spell" ? "Klik huruf satu per satu sesuai urutan ejaan!" : "Klik potongan kata untuk menyusun kalimat!";
        mcqArea.classList.add("hidden");
        builderArea.classList.remove("hidden");
        setupBuilder(item);
      }
    }

    function checkMcq(clickedBtn, chosen, correctAns) {
      if (answered) return;
      answered = true;
      speakEnglish(chosen);
      const allBtns = document.querySelectorAll(".opt-btn");
      if (chosen === correctAns) {
        clickedBtn.classList.add("correct");
        handleAnswerResult(true, `Hebat! Jawaban yang benar adalah "${correctAns}".`);
      } else {
        clickedBtn.classList.add("wrong");
        allBtns.forEach((b) => {
          if (b.textContent === correctAns) b.classList.add("correct");
        });
        handleAnswerResult(false, `Belum tepat. Jawaban yang benar adalah "${correctAns}".`);
      }
    }

    function setupBuilder(item) {
      selectedTokens = [];
      const bank = document.getElementById("bankTokens");
      const slots = document.getElementById("answerSlots");
      slots.innerHTML = `<span style="color:#94a3b8">Klik kepingan di bawah ini...</span>`;
      bank.innerHTML = "";

      const shuffled = shuffleArray(item.tokens.map((t, idx) => ({ text: t, id: idx })));
      shuffled.forEach((tok) => {
        const btn = document.createElement("button");
        btn.className = "token-btn";
        btn.textContent = tok.text;
        btn.dataset.tid = tok.id;
        btn.onclick = () => {
          if (answered || btn.classList.contains("used")) return;
          btn.classList.add("used");
          selectedTokens.push({ text: tok.text, btnRef: btn });
          speakEnglish(tok.text);
          renderSelectedSlots();
        };
        bank.appendChild(btn);
      });
    }

    function renderSelectedSlots() {
      const slots = document.getElementById("answerSlots");
      slots.innerHTML = "";
      if (selectedTokens.length === 0) {
        slots.innerHTML = `<span style="color:#94a3b8">Klik kepingan di bawah ini...</span>`;
        return;
      }
      selectedTokens.forEach((tok, idx) => {
        const chip = document.createElement("button");
        chip.className = "token-btn";
        chip.style.background = "#dbeafe";
        chip.textContent = tok.text;
        chip.onclick = () => {
          if (answered) return;
          tok.btnRef.classList.remove("used");
          selectedTokens.splice(idx, 1);
          renderSelectedSlots();
        };
        slots.appendChild(chip);
      });
    }

    function resetBuilder() {
      if (answered) return;
      selectedTokens.forEach((t) => t.btnRef.classList.remove("used"));
      selectedTokens = [];
      renderSelectedSlots();
    }

    function checkBuilderAnswer() {
      if (answered || selectedTokens.length === 0) return;
      const item = currentGradeObj.items[quizIndex];
      const joiner = item.mode === "spell" ? "" : " ";
      const userAns = selectedTokens.map((t) => t.text).join(joiner);
      answered = true;
      if (userAns === item.answer) {
        speakEnglish(item.en);
        handleAnswerResult(true, `Pintar sekali! Susunan "${item.answer}" benar!`);
      } else {
        handleAnswerResult(false, `Susunan yang tepat adalah: "${item.answer}"`);
      }
    }

    function handleAnswerResult(isCorrect, message) {
      const fb = document.getElementById("feedbackBox");
      fb.classList.remove("hidden", "feedback-ok", "feedback-bad");
      if (isCorrect) {
        correctCount++;
        playTone("win");
        fb.classList.add("feedback-ok");
        fb.textContent = "🎉 " + message;
      } else {
        hearts--;
        playTone("lose");
        document.getElementById("heartsDisplay").textContent = "❤️".repeat(Math.max(0, hearts)) + "🖤".repeat(3 - Math.max(0, hearts));
        fb.classList.add("feedback-bad");
        fb.textContent = "💡 " + message;
      }
      document.getElementById("nextQuestionBtn").classList.remove("hidden");
    }

    function nextQuestion() {
      if (hearts <= 0) {
        finishQuiz(false);
        return;
      }
      quizIndex++;
      if (quizIndex >= currentGradeObj.items.length) {
        finishQuiz(true);
      } else {
        renderQuestion();
      }
    }

    function finishQuiz(completed) {
      showSection("resultScreen");
      const total = currentGradeObj.items.length;
      let earnedStars = 0;
      if (completed) {
        const ratio = correctCount / total;
        earnedStars = ratio >= 0.9 ? 3 : ratio >= 0.65 ? 2 : 1;
        const prev = savedStars[currentGradeObj.grade] || 0;
        if (earnedStars > prev) {
          savedStars[currentGradeObj.grade] = earnedStars;
          localStorage.setItem("eq_sd_stars", JSON.stringify(savedStars));
        }
        document.getElementById("resultIcon").textContent = earnedStars === 3 ? "🏆" : "🌟";
        document.getElementById("resultTitle").textContent = `Selamat! Lulus Kelas ${currentGradeObj.grade} SD!`;
        document.getElementById("resultDesc").textContent =
          `Kamu menjawab benar ${correctCount} dari ${total} soal dan meraih ${"⭐".repeat(earnedStars)}!`;
      } else {
        document.getElementById("resultIcon").textContent = "💪";
        document.getElementById("resultTitle").textContent = "Jangan Menyerah, Yuk Coba Lagi!";
        document.getElementById("resultDesc").textContent =
          `Nyawa hatimu habis. Buka menu "Belajar Dulu" untuk melihat foto & cara bacanya sebelum bermain lagi!`;
      }
    }

    // Jalankan halaman awal saat dibuka
    renderHome();
  </script>
</body>
</html>
